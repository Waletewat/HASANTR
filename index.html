    <style>
        html, body {

            background: linear-gradient(180deg, #d97706 0%, #B45309 45%, #151e2e 100%);
            border-bottom-left-radius: 50% 25px; border-bottom-right-radius: 50% 25px;
            animation: waveSlow 35s ease-in-out infinite alternate;

        .no-scrollbar { -ms-overflow-style: none; scrollbar-width: none; }

    <!-- FIREBASE INTEGRATION SETUP -->
    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/11.6.1/firebase-app.js";
        import { getAuth, signInAnonymously, signInWithCustomToken, onAuthStateChanged } from "https://www.gstatic.com/firebasejs/11.6.1/firebase-auth.js";
        import { getFirestore, collection, addDoc, updateDoc, doc, deleteDoc, onSnapshot, serverTimestamp } from "https://www.gstatic.com/firebasejs/11.6.1/firebase-firestore.js";

        window.db = null;
        window.auth = null;
        window.currentUser = null;
        window.appId = typeof __app_id !== 'undefined' ? __app_id : 'gencer-teknik-app';

        try {
            const firebaseConfig = {
                apiKey: "AIzaSyAZny955XO8L5dXsbSXeXXSf5XEyh2IIho",
                authDomain: "hasan-ce5f9.firebaseapp.com",
                projectId: "hasan-ce5f9",
                storageBucket: "hasan-ce5f9.firebasestorage.app",
                messagingSenderId: "884455783055",
                appId: "1:884455783055:web:90752874c8a70870e4cefa",
                measurementId: "G-WX21RTZJ9C"
            };

            const app = initializeApp(firebaseConfig);
            window.db = getFirestore(app);
            window.auth = getAuth(app);

            const token = typeof __initial_auth_token !== 'undefined' ? __initial_auth_token : null;
            if (token) {
                signInWithCustomToken(window.auth, token).catch(() => signInAnonymously(window.auth));
            } else {
                signInAnonymously(window.auth).catch(err => console.log("Auth fallback active"));
            }

            onAuthStateChanged(window.auth, (user) => {
                if (user) {
                    window.currentUser = user;
                    listenToMesaiLogs();
                    listenToBorcLogs();
                    listenToStaffList();
                }
            });
        } catch (e) {
            console.warn("Firebase fallback mode active:", e);
        }

        // Firestore Listeners
        function listenToMesaiLogs() {
            if (!window.db) return;
            const colRef = collection(window.db, 'artifacts', window.appId, 'public', 'data', 'mesai_records');
            onSnapshot(colRef, (snapshot) => {
                const logs = [];
                snapshot.forEach(d => logs.push({ id: d.id, ...d.data() }));
                window.syncMesaiData(logs);
            }, (err) => console.warn(err));
        }

        function listenToBorcLogs() {
            if (!window.db) return;
            const colRef = collection(window.db, 'artifacts', window.appId, 'public', 'data', 'borc_records');
            onSnapshot(colRef, (snapshot) => {
                const logs = [];
                snapshot.forEach(d => logs.push({ id: d.id, ...d.data() }));
                window.syncBorcData(logs);
            }, (err) => console.warn(err));
        }

        function listenToStaffList() {
            if (!window.db) return;
            const colRef = collection(window.db, 'artifacts', window.appId, 'public', 'data', 'staff_records');
            onSnapshot(colRef, (snapshot) => {
                const list = [];
                snapshot.forEach(d => list.push({ id: d.id, ...d.data() }));
                window.syncStaffData(list);
            }, (err) => console.warn(err));
        }

        // Firestore Actions
        window.fbAddMesai = async function(record) {
            if (window.db) {
                try {
                    const colRef = collection(window.db, 'artifacts', window.appId, 'public', 'data', 'mesai_records');
                    await addDoc(colRef, { ...record, createdAt: serverTimestamp() });
                } catch(e) { console.error(e); }
            }
        }

        window.fbAddBorc = async function(record) {
            if (window.db) {
                try {
                    const colRef = collection(window.db, 'artifacts', window.appId, 'public', 'data', 'borc_records');
                    await addDoc(colRef, { ...record, createdAt: serverTimestamp() });
                } catch(e) { console.error(e); }
            }
        }

        window.fbUpdateBorcStatus = async function(id, resolved) {
            if (window.db) {
                try {
                    const docRef = doc(window.db, 'artifacts', window.appId, 'public', 'data', 'borc_records', id);
                    await updateDoc(docRef, { resolved });
                } catch(e) { console.error(e); }
            }
        }

        window.fbDeleteBorc = async function(id) {
            if (window.db) {
                try {
                    const docRef = doc(window.db, 'artifacts', window.appId, 'public', 'data', 'borc_records', id);
                    await deleteDoc(docRef);
                } catch(e) { console.error(e); }
            }
        }

        window.fbAddStaff = async function(name) {
            if (window.db) {
                try {
                    const colRef = collection(window.db, 'artifacts', window.appId, 'public', 'data', 'staff_records');
                    await addDoc(colRef, { name, createdAt: serverTimestamp() });
                } catch(e) { console.error(e); }
            }
        }

        window.fbDeleteStaff = async function(id) {
            if (window.db) {
                try {
                    const docRef = doc(window.db, 'artifacts', window.appId, 'public', 'data', 'staff_records', id);
                    await deleteDoc(docRef);
                } catch(e) { console.error(e); }
            }
        }
    </script>
</head>

                    <div class="flex gap-2">
                        <input type="text" id="newStaffName" placeholder="Ad Soyad" class="flex-1 bg-slate-900 border border-slate-800 rounded-lg p-2.5 text-xs text-white focus:outline-none focus:border-[#F38E23]">
                        <button onclick="addNewCustomStaff()" class="bg-[#F38E23] text-[#121A29] font-bold px-4 py-2.5 rounded-lg text-xs">Ekle</button>
                    </div>
                    <div class="mt-4">
                        <p class="text-xs text-slate-400 mb-2">Canlı Kayıtlı Personeller:</p>
                        <div id="profileStaffList" class="space-y-2 max-h-64 overflow-y-auto no-scrollbar pb-12"></div>
                    </div>
                </div>
            </div>
            <button onclick="switchTab('home')" class="w-full py-3 bg-slate-800 text-slate-200 font-bold rounded-xl border border-slate-700 mt-4 mb-8 sm:mb-0">
                Ana Sayfaya Dön
            </button>
        </div>

    </div>

    <!-- MAIN APP SCRIPT -->
    <script>
        let liveBorcData = [];
        let liveMesaiData = [];
        let liveStaffData = [
            { id: '1', name: "Ahmet Usta" },
            { id: '2', name: "Mustafa Gencer" },
            { id: '3', name: "Kadir Usta" },
            { id: '4', name: "Mehmet Ekici" },
            { id: '5', name: "Ali Yılmaz" }
        ];

        window.syncBorcData = function(data) {
            liveBorcData = data;
            if (document.getElementById('borcModal') && !document.getElementById('borcModal').classList.contains('hidden')) {
                renderBorcList();
            }
        };

        window.syncMesaiData = function(data) {
            liveMesaiData = data;
            if (document.getElementById('viewDays') && !document.getElementById('viewDays').classList.contains('hidden')) {
                selectDay(selectedDay);
            }
        };

        window.syncStaffData = function(list) {
            if (list.length > 0) {
                liveStaffData = list;
            }
            if (document.getElementById('staffChecklist')) renderStaffChecklist();
            if (document.getElementById('profileStaffList') && !document.getElementById('profileTab').classList.contains('hidden')) {
                renderProfileStaffList();
            }
        };

        const monthNames = ["Ocak", "Şubat", "Mart", "Nisan", "Mayıs", "Haziran", "Temmuz", "Ağustos", "Eylül", "Ekim", "Kasım", "Aralık"];
        const dayNamesShort = ["Pzt", "Sal", "Çar", "Per", "Cum", "Cmt", "Paz"];
        const monthDaysCount = [31, 28, 31, 30, 31, 30, 31, 31, 30, 31, 30, 31];

        let selectedMonthIndex = 10;
        let selectedDay = 3;
        let currentYear = 2026;
        let selectedStaffForTotal = null;

        // Borç Takip
        function renderBorcList() {
            const container = document.getElementById('borcListContainer');
            if (!container) return;
            if (liveBorcData.length === 0) {
                container.innerHTML = `<div class="p-6 text-center text-xs text-slate-500 bg-slate-900 rounded-xl">Kayıtlı borç bulunmuyor.</div>`;
                return;
            }
            container.innerHTML = liveBorcData.map(item => `
                <div class="bg-slate-900 p-3.5 rounded-xl border ${item.resolved ? 'border-emerald-500/40 opacity-75' : 'border-amber-500/40'} flex items-center justify-between">
                    <div>
                        <span class="font-bold text-white text-xs">${item.firma}</span>
                        <span class="text-[10px] bg-slate-800 text-amber-400 px-2 py-0.5 ml-1 rounded font-bold">${item.malzeme}</span>
                        <p class="text-[11px] text-slate-400 mt-1">${item.ack || ''}</p>
                    </div>
                    <div class="flex items-center gap-1.5">
                        <button onclick="window.fbUpdateBorcStatus('${item.id}', ${!item.resolved})" class="px-2.5 py-1 ${item.resolved ? 'bg-emerald-500/20 text-emerald-400' : 'bg-rose-500/20 text-rose-400'} font-bold text-[10px] rounded-lg border border-opacity-40">
                            ${item.resolved ? 'Çözüldü' : 'Çözülmedi'}
                        </button>
                        <button onclick="window.fbDeleteBorc('${item.id}')" class="p-2 text-slate-400 hover:text-rose-400 transition-colors">
                            <i class="fa-solid fa-trash-can text-xs"></i>
                        </button>
                    </div>
                </div>
            `).join('');
        }

        function openAddBorcPage() { document.getElementById('addBorcPage').classList.remove('hidden'); }
        function closeAddBorcPage() { document.getElementById('addBorcPage').classList.add('hidden'); }
        
        function saveNewBorc() {
            const firma = document.getElementById('borcFirma').value;
            const malz = document.getElementById('borcMalzeme').value;
            const birim = document.getElementById('borcBirim').value;
            const ack = document.getElementById('borcAck').value;
            if(!firma || !malz) return;

            window.fbAddBorc({
                firma,
                malzeme: `${malz} ${birim}`,
                ack,
                resolved: false,
                date: new Date().toLocaleDateString('tr-TR')
            });

            document.getElementById('borcFirma').value = '';
            document.getElementById('borcMalzeme').value = '';
            document.getElementById('borcAck').value = '';
            closeAddBorcPage();
        }

        // Mesai Takip
        function renderMonthsGrid() {
            const monthsGrid = document.getElementById('monthsGrid');
            if(!monthsGrid) return;
            monthsGrid.innerHTML = monthNames.map((n, idx) => {
                const count = liveMesaiData.filter(m => m.month === idx).length;
                const isCurrent = idx === selectedMonthIndex;
                return `
                    <div class="flex flex-col gap-1">
                        <button onclick="selectMonth(${idx})" class="p-2.5 rounded-xl border flex flex-col items-center ${isCurrent?'bg-amber-500/10 border-[#F38E23] text-white':'bg-slate-900 border-slate-800 text-slate-300'}">
                            <span class="text-xs font-bold">${n}</span>
                            <span class="text-[9px] text-slate-500">${count} Kayıt</span>
                        </button>
                        <button onclick="openMonthReport(${idx})" class="text-[9px] bg-slate-800 text-amber-400 py-1 rounded font-bold active:scale-95">Rapor</button>
                    </div>
                `;
            }).join('');
        }

        function selectMonth(idx) { 
            selectedMonthIndex = idx; 
            document.getElementById('viewMonths').classList.add('hidden'); 
            document.getElementById('viewDays').classList.remove('hidden'); 
            document.getElementById('selectedMonthLabel').innerText = `${monthNames[idx]} ${currentYear}`; 
            renderDaysGrid(); 
            selectDay(1); 
        }

        function showMonthsView() { 
            document.getElementById('viewDays').classList.add('hidden'); 
            document.getElementById('viewMonthReport').classList.add('hidden'); 
            document.getElementById('viewMonths').classList.remove('hidden'); 
            renderMonthsGrid(); 
        }
        
        function renderDaysGrid() {
            let html = dayNamesShort.map(d => `<span class="text-[10px] text-amber-400 py-1">${d}</span>`).join('');
            for (let d = 1; d <= monthDaysCount[selectedMonthIndex]; d++) {
                const isSelected = d === selectedDay;
                const hasData = liveMesaiData.some(m => m.month === selectedMonthIndex && m.day === d);
                html += `<button onclick="selectDay(${d})" class="py-1.5 rounded-lg text-xs font-bold relative ${isSelected?'bg-[#F38E23] text-[#121A29]':'bg-slate-950 text-slate-300 border border-slate-800/60'}">${d}${hasData && !isSelected ? '<span class="absolute bottom-0.5 left-1/2 -translate-x-1/2 w-1 h-1 rounded-full bg-[#F38E23]"></span>':''}</button>`;
            }
            document.getElementById('daysGrid').innerHTML = html;
        }

        function selectDay(d) {
            selectedDay = d; 
            renderDaysGrid();
            renderStaffChecklist();
            const dayRecs = liveMesaiData.filter(m => m.month === selectedMonthIndex && m.day === d);
            dayRecs.sort((a, b) => b.hours - a.hours);
            renderMesaiList(dayRecs);
            if (!selectedStaffForTotal && liveStaffData.length > 0) selectedStaffForTotal = liveStaffData[0].name;
            calcTotal(selectedStaffForTotal);
        }

        function renderStaffChecklist() {
            const commonHoursVal = document.getElementById('commonHours')?.value || '';
            const checklistContainer = document.getElementById('staffChecklist');
            if(!checklistContainer) return;
            checklistContainer.innerHTML = liveStaffData.map(staff => `
                <div class="bg-slate-950 p-2 rounded-lg border border-slate-800 flex justify-between items-center">
                    <label class="flex items-center gap-2 cursor-pointer flex-1"><input type="checkbox" id="chk_${staff.id}" checked class="rounded border-slate-700 text-[#F38E23]"> <span class="text-xs text-white">${staff.name}</span></label>
                    <input type="number" step="0.5" id="hr_${staff.id}" placeholder="0" value="${commonHoursVal}" class="w-12 bg-slate-900 border border-slate-700 text-xs text-white rounded text-center py-1 focus:border-[#F38E23]">
                </div>
            `).join('');
        }

        function applyCommonHours(val) { 
            liveStaffData.forEach(s => { 
                const inp = document.getElementById(`hr_${s.id}`);
                if(inp) inp.value = val; 
            }); 
        }

        function saveSelectedStaffToDay() {
            const commonNote = document.getElementById('commonNote').value || 'Saha Mesaisi';
            const dateStr = `${selectedDay < 10 ? '0' + selectedDay : selectedDay}.${selectedMonthIndex + 1 < 10 ? '0' + (selectedMonthIndex + 1) : selectedMonthIndex + 1}.${currentYear}`;

            liveStaffData.forEach(s => {
                const chk = document.getElementById(`chk_${s.id}`);
                if(chk && chk.checked) {
                    const hrs = parseFloat(document.getElementById(`hr_${s.id}`)?.value || 0);
                    if(hrs > 0) {
                        window.fbAddMesai({
                            person: s.name,
                            hours: hrs,
                            note: commonNote,
                            date: dateStr,
                            day: selectedDay,
                            month: selectedMonthIndex,
                            year: currentYear
                        });
                    }
                }
            });
            document.getElementById('commonHours').value = '';
            document.getElementById('commonNote').value = '';
            selectDay(selectedDay);
        }

        function renderMesaiList(list) {
            const container = document.getElementById('mesaiListContainer');
            if(!container) return;
            container.innerHTML = list.map((item, idx) => `
                <div onclick="selectPersonForTotal('${item.person}')" class="bg-slate-900 p-2.5 rounded-lg border ${selectedStaffForTotal === item.person ? 'border-[#F38E23] bg-slate-800/80' : 'border-slate-800'} flex justify-between items-center text-xs cursor-pointer">
                    <div class="flex items-center gap-2">
                        <span class="w-5 h-5 rounded-full bg-slate-800 text-[10px] font-mono font-bold text-amber-500 flex items-center justify-center border border-slate-700">${idx + 1}</span>
                        <div>
                            <p class="font-bold text-white">${item.person}</p>
                            <p class="text-[10px] text-slate-400">${item.note || 'Mesai'}</p>
                        </div>
                    </div>
                    <span class="text-[#F38E23] font-bold font-mono px-2 py-0.5 bg-[#F38E23]/10 rounded border border-[#F38E23]/20">+${item.hours} Saat</span>
                </div>
            `).join('');
        }

        function selectPersonForTotal(person) {
            selectedStaffForTotal = person;
            const dayRecs = liveMesaiData.filter(m => m.month === selectedMonthIndex && m.day === selectedDay);
            renderMesaiList(dayRecs);
            calcTotal(person);
        }

        function calcTotal(person) {
            const tot = liveMesaiData.filter(m => m.month === selectedMonthIndex && m.person === person).reduce((s, i) => s + (parseFloat(i.hours)||0), 0);
            const totalEl = document.getElementById('animatedMonthTotal');
            const labelEl = document.getElementById('activeStaffTotalLabel');
            if(totalEl) totalEl.innerText = tot.toFixed(1);
            if(labelEl) labelEl.innerText = `${person} (${monthNames[selectedMonthIndex]})`;
        }

        function openMonthReport(idx) {
            selectedMonthIndex = idx; 
            document.getElementById('viewMonths').classList.add('hidden'); 
            document.getElementById('viewMonthReport').classList.remove('hidden');
            document.getElementById('reportMonthTitle').innerText = `${monthNames[idx]} Ayı Raporu`;
            document.getElementById('monthReportListContainer').innerHTML = liveStaffData.map(s => {
                const tot = liveMesaiData.filter(m => m.month === idx && m.person === s.name).reduce((sum, i) => sum + (parseFloat(i.hours)||0), 0);
                return `<div class="bg-slate-950 p-3 rounded-xl border border-slate-800 flex justify-between text-xs text-white"><span>${s.name}</span><span class="text-amber-400 font-bold">${tot.toFixed(1)} Saat</span></div>`;
            }).join('');
        }

        // Profile
        function addNewCustomStaff() {
            const inputEl = document.getElementById('newStaffName');
            const n = inputEl ? inputEl.value.trim() : '';
            if(n) { 
                window.fbAddStaff(n);
                inputEl.value = ''; 
            }
        }
        function renderProfileStaffList() {
            const listEl = document.getElementById('profileStaffList');
            if(!listEl) return;
            listEl.innerHTML = liveStaffData.map(s => `
                <div class="bg-slate-900 p-2.5 rounded-lg text-xs text-white flex justify-between items-center">
                    <span>${s.name}</span>
                    <div class="flex items-center gap-2">
                        <span class="text-[10px] text-emerald-400 font-bold">● Canlı</span>
                        <button onclick="window.fbDeleteStaff('${s.id}')" class="text-slate-400 hover:text-rose-400 p-1"><i class="fa-solid fa-trash-can text-xs"></i></button>
                    </div>
                </div>
            `).join('');
        }

        // Utilities
        function openModal(id) { 
            const modal = document.getElementById(id);
            if(modal) modal.classList.remove('hidden'); 
            if(id === 'borcModal') renderBorcList(); 
            if(id === 'mesaiModal') showMonthsView(); 
        }
        function closeModal(id) { 
            const modal = document.getElementById(id);
            if(modal) modal.classList.add('hidden'); 
        }
        function switchTab(t) { 
            const profileTab = document.getElementById('profileTab');
            if(t === 'profile'){ 
                if(profileTab) profileTab.classList.remove('hidden'); 
                renderProfileStaffList();
            } else { 
                if(profileTab) profileTab.classList.add('hidden'); 
            } 
        }
    </script>
</body>
</html>
